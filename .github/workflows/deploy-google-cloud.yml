name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE_NAME: farmlog
      IMAGE_NAME: farmlog
      DB_PASSWORD_SECRET: farmlog-db-password

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push container
        shell: bash
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          gcloud builds submit --project "${{ vars.GCP_PROJECT_ID }}" --tag "${IMAGE}" .

      - name: Deploy private Cloud Run service
        shell: bash
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars "INSTANCE_CONNECTION_NAME=${{ vars.CLOUD_SQL_CONNECTION_NAME }},PGUSER=${{ vars.PGUSER }},PGDATABASE=${{ vars.PGDATABASE }},DB_POOL_MAX=5,ENABLE_SAMPLE_DATA=false,ALLOWED_EMAIL_DOMAIN=${{ vars.ALLOWED_EMAIL_DOMAIN }},IAP_AUDIENCE=/projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/${{ vars.GCP_REGION }}/services/${SERVICE_NAME},SITE_URL=${{ vars.SITE_URL }}" \
            --set-secrets "PGPASSWORD=${DB_PASSWORD_SECRET}:latest" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 20 \
            --min 0 \
            --max 10 \
            --timeout 60 \
            --startup-probe "httpGet.path=/api/health,initialDelaySeconds=5,timeoutSeconds=3,periodSeconds=10,failureThreshold=12" \
            --no-allow-unauthenticated \
            --iap \
            --quiet

      - name: Allow IAP to invoke Cloud Run
        shell: bash
        run: |
          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --member "serviceAccount:service-${{ vars.GCP_PROJECT_NUMBER }}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role "roles/run.invoker" \
            --quiet

      - name: Show production URL
        shell: bash
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)'
