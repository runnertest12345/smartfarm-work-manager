name: Deploy static site to Compute Engine

on:
  workflow_dispatch:

concurrency:
  group: smartfarm-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_WORKSPACE_ID: sheet-20260903-579dfadc
      NEXT_PUBLIC_SITE_URL: https://${{ vars.VM_SITE_HOST }}
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'false'
      VM_SITE_HOST: ${{ vars.VM_SITE_HOST }}

    steps:
      - name: Check out private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validate public build settings
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            VM_SITE_HOST
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub repository variable: ${name#NEXT_PUBLIC_}" >&2
              exit 1
            fi
          done
          if [[ "${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" != "smartfarm-work-manager" ]]; then
            echo "FIREBASE_PROJECT_ID must target smartfarm-work-manager." >&2
            exit 1
          fi
          if [[ "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" != "smartfarm-work-manager.firebaseapp.com" ]]; then
            echo "FIREBASE_AUTH_DOMAIN does not match the production project." >&2
            exit 1
          fi
          if [[ "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" != "smartfarm-work-manager.firebasestorage.app" && "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" != "smartfarm-work-manager.appspot.com" ]]; then
            echo "FIREBASE_STORAGE_BUCKET does not match the production project." >&2
            exit 1
          fi
          if [[ ! "${NEXT_PUBLIC_FIREBASE_APP_ID}" =~ ^1:${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}:web:[0-9A-Za-z]+$ ]]; then
            echo "FIREBASE_APP_ID and FIREBASE_MESSAGING_SENDER_ID do not match." >&2
            exit 1
          fi
          firebase_tuple_hash="$(
            printf '%s\n' \
              "${NEXT_PUBLIC_FIREBASE_API_KEY}" \
              "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" \
              "${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
              "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" \
              "${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}" \
              "${NEXT_PUBLIC_FIREBASE_APP_ID}" \
              | sha256sum | cut -d ' ' -f 1
          )"
          if [[ "${firebase_tuple_hash}" != "3fe1333ca195635ceb9b4763b85771eda80b879899c810d3af43e522112137cd" ]]; then
            echo "Firebase web configuration does not match the verified production tuple." >&2
            exit 1
          fi
          if [[ ! "${VM_SITE_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9]$ || "${VM_SITE_HOST}" == *..* ]]; then
            echo "VM_SITE_HOST is not a valid host name." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm lint
          pnpm exec tsc --noEmit --incremental false
          pnpm build
          test -f out/index.html

      - name: Package immutable release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          archive="site-${release_id}.tar.gz"
          printf '{"releaseId":"%s","commit":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "${release_id}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            > out/release.json
          tar --create --gzip --file "${archive}" --directory out .
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site-*.tar.gz
            site-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      VM_SITE_HOST: ${{ vars.VM_SITE_HOST }}

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle

      - name: Validate deployment settings and artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(VM_HOST VM_USER VM_SITE_HOST)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
            echo "Missing GitHub repository variable: ${name}" >&2
              exit 1
            fi
          done
          if [[ "${VM_USER}" != 'smartfarm-deploy' ]]; then
            echo "VM_USER must be the dedicated smartfarm-deploy account." >&2
            exit 1
          fi
          for host_value in "${VM_HOST}" "${VM_SITE_HOST}"; do
            if [[ ! "${host_value}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9]$ || "${host_value}" == *..* ]]; then
              echo "Invalid VM host setting." >&2
              exit 1
            fi
          done
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          archive="site-${release_id}.tar.gz"
          test -f "release-bundle/${archive}"
          test -f "release-bundle/${archive}.sha256"
          (
            cd release-bundle
            sha256sum --check "${archive}.sha256"
          )

      - name: Upload and promote release over SSH
        shell: bash
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${VM_SSH_PRIVATE_KEY:-}" || -z "${VM_KNOWN_HOSTS:-}" ]]; then
            echo "Missing production SSH secret." >&2
            exit 1
          fi

          key_file="${RUNNER_TEMP}/smartfarm-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/smartfarm-known-hosts"
          cleanup() {
            rm -f -- "${key_file}" "${known_hosts_file}"
          }
          trap cleanup EXIT

          printf '%s\n' "${VM_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${known_hosts_file}"
          chmod 600 "${key_file}" "${known_hosts_file}"

          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          archive="site-${release_id}.tar.gz"
          remote_archive="/srv/smartfarm-work-manager/incoming/${archive}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
            -i "${key_file}"
          )

          scp "${ssh_options[@]}" "release-bundle/${archive}" \
            "${VM_USER}@${VM_HOST}:${remote_archive}"
          ssh "${ssh_options[@]}" "${VM_USER}@${VM_HOST}" \
            "/usr/local/bin/promote-smartfarm-release '${remote_archive}' '${release_id}'"

      - name: Verify deployed release over HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          for attempt in {1..12}; do
            response="$({
              curl --fail --silent --show-error \
                --proto '=https' --tlsv1.2 --max-time 15 \
                "https://${VM_SITE_HOST}/release.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            } || true)"
            if grep --fixed-strings --quiet "\"releaseId\":\"${release_id}\"" <<<"${response}"; then
              exit 0
            fi
            sleep 5
          done
          echo "HTTPS verification did not return the promoted release." >&2
          exit 1
